name: Gemini Bridge prototype tests
on:
  push:
    branches: [gemini-bridge-dev]
  pull_request:
    paths:
      - 'gemini-bridge/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gemini-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check server.mjs
      - run: node --check src/gemini.mjs
      - run: docker build -t gemini-bridge-prototype .
