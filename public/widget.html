<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation Studio Mobile Test</title><style>body{margin:0;background:#15131b;color:#f8f3fa;font:16px system-ui,sans-serif}.wrap{max-width:450px;margin:auto;padding:20px 16px}h1{font-size:25px}.muted{color:#bcb2c8}.card{background:#28222e;border-radius:16px;padding:16px;margin:16px 0}.line{padding:12px;border-bottom:1px solid #4d4554;border-radius:8px;cursor:pointer;line-height:1.5}.line.selected{outline:2px solid #d1a7f8}.line.locked:before{content:'🔒 '}button{background:#7a4db4;color:white;border:0;border-radius:12px;padding:13px 15px;margin:5px 4px 5px 0;font:inherit;min-height:46px}button:focus-visible{outline:3px solid white}.status{min-height:25px;color:#c9b1e6}</style></head><body><main class="wrap"><h1>🎭 Conversation Studio</h1><p class="muted">Disposable Android touch test — no real novels</p><p id="counter"></p><div class="card" id="lines"></div><div><button id="prev">◀ Previous</button><button id="next">Next ▶</button><button id="random">🎲 Randomize</button></div><div><button id="favorite">♡ Favorite</button><button id="protect">🔒 Protect selected line</button><button id="reset">Reset</button></div><p id="status" class="status" role="status">Tap a dialogue line to select it.</p><section class="card"><h2>✦ Generate dialogue</h2><label>Scene and stakes<textarea id="scene" style="display:block;width:95%;height:95px;margin:8px 0;background:#17131b;color:white" placeholder="What happens, who wants what, and what is unsaid?"></textarea></label><label>Character voices<textarea id="voices" style="display:block;width:95%;height:70px;margin:8px 0;background:#17131b;color:white" placeholder="Names, personalities, secrets, relationship"></textarea></label><label>Energy <select id="energy"><option>Slow-burn tension</option><option>Heartbreaking</option><option>Dangerous flirtation</option><option>Dark humor</option><option>Explosive confrontation</option></select></label><p><button id="generate">Generate 3 options</button></p><p id="aiStatus" role="status"></p><div id="aiOptions"></div></section><script>document.getElementById('generate').onclick=async()=>{const b=document.getElementById('generate'),status=document.getElementById('aiStatus'),out=document.getElementById('aiOptions');if(!document.getElementById('scene').value.trim()){status.textContent='Describe a scene first.';return}b.disabled=true;status.textContent='Writing dialogue…';try{const response=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scene:document.getElementById('scene').value,characters:document.getElementById('voices').value,tone:document.getElementById('energy').value})});const data=await response.json();if(!response.ok)throw Error(data.error);out.replaceChildren(...data.options.map((option,i)=>{const card=document.createElement('div');card.className='card';const title=document.createElement('h3');title.textContent=(i+1)+'. '+option.title;card.append(title);for(const line of option.lines){const p=document.createElement('p');p.textContent=line;card.append(p)}const copy=document.createElement('button');copy.textContent='Copy this option';copy.onclick=()=>navigator.clipboard.writeText(option.lines.join('\n'));card.append(copy);return card}));status.textContent='Three approaches ready.'}catch(e){status.textContent=e.message}finally{b.disabled=false}};</script></main><script>const samples=[['“You brought a shovel?”','“You said it was an emergency.”','“It’s a surprise party, Eli.”','“Then why did you whisper?”'],['“Are you avoiding me?”','“I’m standing right here.”','“That wasn’t my question.”','“I know.”'],['“You bought six lemons.”','“You said we needed lemons.”','“For one pie.”','“Then we’re prepared for five more.”']];let index=0,selected=-1;const favorites=new Set(),locks=new Set();const $=id=>document.getElementById(id);function render(){ $('counter').textContent='Conversation '+(index+1)+' of '+samples.length;$('lines').replaceChildren(...samples[index].map((s,i)=>{const el=document.createElement('div');el.className='line'+(selected===i?' selected':'')+(locks.has(index+':'+i)?' locked':'');el.textContent=s;el.onclick=()=>{selected=i;render();$('status').textContent='Line '+(i+1)+' selected.'};return el}));$('favorite').textContent=(favorites.has(index)?'♥ Favorited':'♡ Favorite')}function move(n){index=(n+samples.length)%samples.length;selected=-1;render();$('status').textContent='Conversation changed.'}$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);$('random').onclick=()=>move(index+1+Math.floor(Math.random()*(samples.length-1)));$('favorite').onclick=()=>{favorites.has(index)?favorites.delete(index):favorites.add(index);render();$('status').textContent='Favorite updated.'};$('protect').onclick=()=>{if(selected<0){$('status').textContent='Select a line first.';return}const key=index+':'+selected;locks.has(key)?locks.delete(key):locks.add(key);render();$('status').textContent='Line protection updated.'};$('reset').onclick=()=>{favorites.clear();locks.clear();selected=-1;render();$('status').textContent='All selections cleared.'};render();</script></body></html>
